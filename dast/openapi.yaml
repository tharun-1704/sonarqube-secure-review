openapi: 3.0.3
info:
  title: Secure Review Lab API
  version: "1.0"
servers:
  - url: http://localhost:5000
paths:
  /register:
    post:
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string, example: alice}
                password: {type: string, example: password123}
      responses:
        "200": {description: registered}
  /user:
    get:
      parameters:
        - {name: username, in: query, required: true, schema: {type: string, example: alice}}
      responses:
        "200": {description: user lookup}
  /ping:
    get:
      parameters:
        - {name: host, in: query, required: true, schema: {type: string, example: 127.0.0.1}}
      responses:
        "200": {description: reachability}
  /calc:
    get:
      parameters:
        - {name: expr, in: query, required: true, schema: {type: string, example: "1"}}
      responses:
        "200": {description: result}
  /fetch:
    get:
      parameters:
        - {name: url, in: query, required: true, schema: {type: string, example: "https://example.com"}}
      responses:
        "200": {description: fetch status}
